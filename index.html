<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden}body{font-family:"Segoe UI",Arial,sans-serif;color:#fff;background:radial-gradient(circle at 50% 30%,#35456f,#121b38 48%,#050914 100%)}
#stars{position:fixed;inset:0;z-index:0}.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 50% 25%,rgba(90,120,190,.18),transparent 45%),linear-gradient(to bottom,rgba(3,9,25,.1),rgba(2,5,15,.78))}.moon{position:fixed;right:9%;top:8%;width:90px;height:90px;border-radius:50%;background:#fff1bf;box-shadow:0 0 45px rgba(255,239,180,.35);z-index:0;opacity:.85}
.wrap{position:relative;z-index:3;width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:18px}.card{width:min(560px,94vw);text-align:center}.panda{width:min(190px,48vw);height:min(190px,48vw);object-fit:contain;display:block;margin:0 auto 18px;filter:drop-shadow(0 12px 20px rgba(0,0,0,.28));animation:pandaFloat 3s ease-in-out infinite}.title{font-size:clamp(27px,7vw,42px);margin-bottom:15px;text-shadow:0 3px 16px rgba(0,0,0,.6)}.message{min-height:100px;max-width:480px;margin:0 auto 22px;font-size:clamp(16px,4.5vw,19px);line-height:1.8;text-shadow:0 2px 12px #000;white-space:pre-line}.btn{border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:13px 29px;color:#fff;background:linear-gradient(135deg,#ff4f87,#ff789e);font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 10px 30px rgba(255,70,130,.3);transition:.25s}.btn:hover{transform:translateY(-2px) scale(1.03)}.btn:active{transform:scale(.94)}.hint{margin-top:16px;font-size:13px;color:rgba(255,255,255,.58)}.hidden{display:none!important}.fade{animation:fade .65s ease}.cursor{display:inline-block;width:2px;height:21px;background:#fff;margin-left:3px;vertical-align:-3px;animation:blink .7s infinite}.heart{position:fixed;bottom:-40px;left:var(--left);font-size:var(--size);z-index:2;pointer-events:none;opacity:0;animation:up var(--duration) linear forwards}@keyframes fade{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}@keyframes pandaFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(5px) rotate(2deg)}}@keyframes blink{50%{opacity:0}}@keyframes up{0%{opacity:0;transform:translateY(0) translateX(0) scale(.6)}10%{opacity:.9}100%{opacity:0;transform:translateY(-115vh) translateX(var(--drift)) scale(1.15) rotate(25deg)}}
@media(max-width:500px){.moon{width:65px;height:65px}.panda{width:155px;height:155px}.title{font-size:29px}.message{font-size:16px;line-height:1.75}}
</style></head><body>

const scenes=[
 ['Hai kamu... ❤️','Makasih ya, udah ada dan jadi bagian penting dari hari-hariku. 💕',0],
 ['Aku kadang suka mikir...','Beruntung banget bisa mengenal kamu. 🥰',1],
 ['Kalau hari ini melelahkan...','Istirahat dulu ya. Semoga malam ini kamu bisa tidur dengan tenang. 😴',2],
 ['Aku harap kamu selalu...','Bahagia, sehat, dan selalu punya alasan buat senyum setiap hari. ✨',2],
 ['Dan satu hal lagi...','Jangan lupa, kamu itu spesial. ❤️',1],
 ['Selamat malam, kamu 🌙','Tidur yang nyenyak ya... Mimpiin aku juga, hehe 🥰❤️',2]
];
let i=0,timer,auto;
function startStory(){document.getElementById('opening').classList.add('hidden');document.getElementById('story').classList.remove('hidden');i=0;showScene();burst(18)}
function showScene(){clearInterval(timer);clearTimeout(auto);const s=scenes[i],img=document.getElementById('panda'),title=document.getElementById('title'),msg=document.getElementById('message'),final=document.getElementById('final');img.src=PANDA[s[2]];img.classList.remove('fade');title.classList.remove('fade');msg.classList.remove('fade');void img.offsetWidth;img.classList.add('fade');title.classList.add('fade');msg.classList.add('fade');title.textContent=s[0];msg.innerHTML='';final.classList.add('hidden');let n=0;const cursor=document.createElement('span');cursor.className='cursor';msg.appendChild(cursor);timer=setInterval(()=>{if(n<s[1].length){msg.insertBefore(document.createTextNode(s[1][n++]),cursor)}else{clearInterval(timer);cursor.remove();auto=setTimeout(next,2200)}},45)}
function next(){i++;if(i<scenes.length){burst(6);showScene()}else{showFinal()}}
function showFinal(){document.getElementById('panda').src=PANDA[2];document.getElementById('title').textContent='Good Night ❤️';document.getElementById('message').textContent='Semoga malam ini membuatmu tersenyum.
Tidur yang nyenyak ya... 🌙✨';document.getElementById('final').classList.remove('hidden');burst(35)}
function finish(){burst(90);document.getElementById('final').textContent='❤️ Peluk terkirim';document.getElementById('final').disabled=true;document.getElementById('message').textContent='Semoga mimpi indah dan besok jadi hari yang lebih baik. ❤️'}
function heart(){const e=document.createElement('div');e.className='heart';e.textContent=['❤️','💕','💗','💖','💓'][Math.floor(Math.random()*5)];const d=Math.random()*5+5;e.style.setProperty('--size',Math.random()*22+14+'px');e.style.setProperty('--left',Math.random()*100+'%');e.style.setProperty('--duration',d+'s');e.style.setProperty('--drift',(Math.random()*160-80)+'px');document.body.appendChild(e);setTimeout(()=>e.remove(),d*1000)}
function burst(n){for(let x=0;x<n;x++)setTimeout(heart,x*65)}
setInterval(()=>{if(document.querySelectorAll('.heart').length<15)heart()},1600);
const c=document.getElementById('stars'),x=c.getContext('2d');let W,H,stars=[];function resize(){W=c.width=innerWidth;H=c.height=innerHeight;stars=Array.from({length:Math.min(170,Math.floor(W/5))},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.2,a:Math.random(),s:Math.random()*.012+.003,d:1}))}function draw(){x.clearRect(0,0,W,H);stars.forEach(s=>{s.a+=s.s*s.d;if(s.a>1||s.a<.15)s.d*=-1;x.globalAlpha=s.a;x.fillStyle='#fff';x.beginPath();x.arc(s.x,s.y,s.r,0,Math.PI*2);x.fill()});x.globalAlpha=1;requestAnimationFrame(draw)}resize();addEventListener('resize',resize);draw();
